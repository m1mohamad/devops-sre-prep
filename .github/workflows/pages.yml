name: Validate and deploy MkDocs site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/check_duplicate_content.py
      - run: python scripts/check_mermaid_blocks.py
      - run: python scripts/check_architecture_similarity.py
      - run: python scripts/check_study_similarity.py
      - run: python scripts/check_interview_quality.py
      - run: python scripts/check_journey_quality.py
      - run: python scripts/check_simulator_quality.py
      - run: python scripts/check_obsidian_compatibility.py
      - run: python -m py_compile scripts/*.py
      - run: python scripts/check_required_sections.py
      - run: python scripts/check_internal_links.py
      - run: mkdocs build --strict

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
