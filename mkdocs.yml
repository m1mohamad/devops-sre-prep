site_name: Platform Engineer Handbook
site_description: A production-grade platform engineering handbook, architecture library, interview companion, simulator, and engineering journey.
site_url: https://m1mohamad.github.io/devops-sre-prep/
repo_url: https://github.com/m1mohamad/devops-sre-prep
repo_name: devops-sre-prep
edit_uri: edit/main/docs/
exclude_docs: |
  study/README.md

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - minify:
      minify_html: true
  - awesome-pages

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - styles/handbook.css
extra_javascript:
  - assets/mermaid-theme.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/m1mohamad/devops-sre-prep

nav:
  - Home: index.md
  - Study Vault:
      - Dashboard: study/00-interview-dashboard.md
      - System Map: study/01-system-map.md
      - Seven-Day Plan: study/02-seven-day-study-plan.md
      - Kubernetes: study/kubernetes/index.md
      - CI/CD: study/cicd/index.md
      - Infrastructure as Code: study/iac/index.md
      - AWS: study/aws/index.md
      - Observability: study/observability/index.md
      - AI Platform: study/ai-platform/index.md
      - Platform Engineering: study/platform-engineering/index.md
      - Interview Practice: study/interview/index.md
  - Handbook:
      - Overview: chapters/index.md
      - Knowledge Graph: knowledge-graph/index.md
      - Software Delivery: chapters/software-delivery.md
      - Containers: chapters/containers.md
      - Kubernetes: chapters/kubernetes.md
      - GitOps: chapters/gitops.md
      - AWS Foundations: chapters/aws-foundations.md
      - Observability: chapters/observability.md
      - Security: chapters/security.md
      - Reliability: chapters/reliability.md
      - AI Platforms: chapters/ai-platforms.md
  - Architecture Library:
      - Overview: architecture/index.md
      - Code to Production: architecture/code-to-production.md
      - Kubernetes Control Plane: architecture/kubernetes-control-plane.md
      - Kubernetes Request Lifecycle: architecture/kubernetes-request-lifecycle.md
      - Kubernetes Networking: architecture/kubernetes-networking.md
      - GitOps with Argo CD: architecture/gitops-argocd.md
      - Terraform AWS Platform: architecture/terraform-aws-platform.md
      - EKS Production Platform: architecture/eks-production-platform.md
      - Observability Pipeline: architecture/observability-pipeline.md
      - Service Mesh: architecture/service-mesh.md
      - Custom Controller: architecture/custom-controller.md
      - AI Inference Platform: architecture/ai-inference-platform.md
      - Multi-Region Platform: architecture/multi-region-platform.md
      - Incident Response Loop: architecture/incident-response-loop.md
  - Interview Companion: interview/index.md
  - Production Simulator: simulator/index.md
  - Engineering Journey: journey/index.md

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
